# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# This workflow is automatically triggered for every push and pull request, to verify that everything still builds.

name: Continuous Integration
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Test a few selected combinations of parameters ("test case matrix").
        # While it would be nice to test all needed combinations, in practice this would a waste of CI usage time.
        # By building just with a few combinations, we only need a few runners,
        # while still achieving adequate coverage.
        # To make a full build with all combinations, use the make_build.yml workflow instead.
        include:
          - target: { platform: linux, arch: x86_64, os: ubuntu-22.04 }
            target-type: template_debug
            float-precision: single
          - target: { platform: windows, arch: x86_64, os: windows-latest }
            target-type: template_release
            float-precision: single
          - target: { platform: macos, arch: universal, os: macos-latest }
            target-type: template_debug
            float-precision: single
          - target: { platform: android, arch: arm64, os: ubuntu-22.04 }
            target-type: template_debug
            float-precision: single
          - target: { platform: web, arch: wasm32, os: ubuntu-22.04 }
            target-type: template_release
            float-precision: single

    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Lint
      #- name: Setup clang-format
      #  shell: bash
      #  run: |
      #    python -m pip install clang-format
      #- name: Run clang-format
      #  shell: bash
      #  run: |
      #    clang-format src/** --dry-run --Werror

      # Add linux x86_32 toolchain
      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # Setup dependencies
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      # Build GDExtension (with caches)

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension Debug Build
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

  # --- Reproducer: godot --headless --import SEGVs inside the GDExtension
  # when BOTH the linux .so and the web .wasm are present in project/bin/.
  # With only the linux .so present, the same Godot version imports
  # cleanly. So the trigger is the multi-platform binary set on disk,
  # not the host-side load alone.
  multi-platform-import:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: 4.6.3
      GODOT_STATUS: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup godot-cpp toolchain (linux)
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: linux

      - name: Build linux GDExtension (template_debug)
        run: scons -j"$(nproc)" target=template_debug platform=linux arch=x86_64 precision=single

      - name: Setup godot-cpp toolchain (web, adds emsdk)
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: web
          em-version: 3.1.62

      - name: Build web GDExtension (template_release, nothreads)
        run: scons -j"$(nproc)" target=template_release platform=web arch=wasm32 precision=single threads=no

      - name: Confirm both binaries are present in project/bin/
        run: |
          set -euo pipefail
          ls -lR project/bin
          test -f project/bin/linux/libEXTENSION-NAME.linux.template_debug.x86_64.so
          test -f project/bin/web/libEXTENSION-NAME.web.template_release.wasm32.nothreads.wasm

      - name: Install Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}
        run: |
          set -euo pipefail
          ver=${GODOT_VERSION}-${GODOT_STATUS}
          base="https://github.com/godotengine/godot/releases/download/${ver}"
          curl -fsSL "${base}/Godot_v${ver}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${ver}_linux.x86_64" "$HOME/godot"
          chmod +x "$HOME/godot"
          echo "$HOME" >> "$GITHUB_PATH"
          "$HOME/godot" --version

      - name: godot --headless --import (expected to SEGV inside libEXTENSION-NAME.so)
        run: |
          set -euo pipefail
          cd project
          import_log="$RUNNER_TEMP/import.log"
          godot --headless --import 2>&1 | tee "$import_log" || true
          godot --headless --import 2>&1 | tee -a "$import_log"
          if grep -qF 'handle_crash: Program crashed with signal' "$import_log"; then
            echo "::error::Confirmed: godot --headless --import SEGV'd inside libEXTENSION-NAME.so with both linux+web binaries on disk."
            grep -nE 'handle_crash|signal 11|libEXTENSION-NAME|example_library_init|stack smashing' "$import_log" | head -20
            exit 1
          fi
          echo "No crash observed — the multi-platform-binary hypothesis was wrong."

      - name: Control — single-platform import (linux .so only, no web wasm)
        if: always()
        run: |
          set -euo pipefail
          rm -rf project/bin/web project/.godot
          cd project
          control_log="$RUNNER_TEMP/control.log"
          godot --headless --import 2>&1 | tee "$control_log" || true
          godot --headless --import 2>&1 | tee -a "$control_log"
          if grep -qF 'handle_crash: Program crashed with signal' "$control_log"; then
            echo "::warning::Control also crashed — bug is not multi-platform-specific."
          else
            echo "Control imported cleanly — consistent with the multi-platform hypothesis."
          fi
